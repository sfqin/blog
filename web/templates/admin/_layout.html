{{define "admin_head"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — admin · dev@home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/crt.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="crt-scanlines"></div>
<div class="crt-vignette"></div>
<div class="admin-shell">
  <aside class="admin-side">
    <a class="brand" href="/admin">dev@home:~#</a>
    <a href="/admin" class="{{if eq .Active "dashboard"}}active{{end}}">dashboard</a>
    <a href="/admin/profile" class="{{if eq .Active "profile"}}active{{end}}">profile</a>
    <a href="/admin/experiences" class="{{if eq .Active "experiences"}}active{{end}}">experiences</a>
    <a href="/admin/thoughts" class="{{if eq .Active "thoughts"}}active{{end}}">thoughts</a>
    <a href="/admin/projects" class="{{if eq .Active "projects"}}active{{end}}">projects</a>
    <a href="/admin/posts" class="{{if eq .Active "posts"}}active{{end}}">posts</a>
    <a href="/admin/footprints" class="{{if eq .Active "footprints"}}active{{end}}">footprints</a>
    <div class="logout">
      <a href="/" target="_blank">↗ view site</a>
      <form method="post" action="/admin/logout" style="padding:9px 18px">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <button class="btn-ghost" type="submit">logout</button>
      </form>
    </div>
  </aside>
  <main class="admin-main">
    {{if .Flash}}<div class="flash">✓ {{.Flash}}</div>{{end}}
{{end}}

{{define "admin_foot"}}
  </main>
</div>
</body>
</html>
{{end}}
