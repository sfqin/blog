# OPTIONAL: deploy the gh-pages branch to GitHub Pages as a mirror/fallback.
#
# dist/ is intentionally ignored on master: the SQLite database with all live
# content stays on the author's machine, and static output is generated by the
# local publish script. scripts/publish-all.sh pushes a sub-path build to the
# gh-pages branch; this workflow can deploy that branch when GitHub Pages is
# configured with Source = "GitHub Actions".

name: Deploy GitHub Pages mirror

on:
  push:
    branches: [master, main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  source-branch:
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "dist/ is intentionally ignored on source branches."
          echo "Run scripts/publish-all.sh locally to generate and push gh-pages."

  deploy:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
